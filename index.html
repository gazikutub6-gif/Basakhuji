<style>
:root{--bg:#fff;--bg2:#f2f6fd;--ink:#0d1b3a;--mut:#51607f;--line:#d9e2f3;--blue:#1646c8;--blue2:#0c2f8f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1428;--bg2:#101c38;--ink:#eaf0ff;--mut:#9fb0d3;--line:#223259;--blue:#5b8cff;--blue2:#8fb0ff;--on:#07122a}}
:root[data-theme="dark"]{--bg:#0b1428;--bg2:#101c38;--ink:#eaf0ff;--mut:#9fb0d3;--line:#223259;--blue:#5b8cff;--blue2:#8fb0ff;--on:#07122a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.bar{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;color:var(--ink);text-decoration:none;margin-right:auto}
.logo b{color:var(--blue)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
nav a:hover,nav a.on{background:var(--bg2);color:var(--blue)}
.lang{border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;font-size:14px;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:var(--blue2);color:#fff;padding:56px 0 48px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 12px;max-width:16em;letter-spacing:-.02em}
.hero p{margin:0 0 24px;max-width:36em;color:#cfdcff;font-size:18px}
.search{display:flex;gap:8px;background:#fff;padding:8px;border-radius:10px;max-width:640px;flex-wrap:wrap}
.search input{flex:1;min-width:150px;border:0;font:inherit;padding:10px;color:#0d1b3a;background:#fff;border-radius:6px}
.btn{background:var(--blue);color:var(--on);border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:none;color:var(--blue);border:1px solid var(--blue)}
.hero .btn{background:#1646c8;color:#fff}
section{padding:40px 0}
h2{font-size:26px;margin:0 0 16px;letter-spacing:-.01em}
.job{display:flex;gap:16px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:var(--ink);background:var(--bg)}
.job:hover{border-color:var(--blue)}
.job h3{margin:0;font-size:18px;color:var(--blue)}
.job small{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--bg2);color:var(--blue2);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;margin:4px 6px 0 0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
select,input,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.band{background:var(--bg2)}
.alert{display:flex;gap:8px;flex-wrap:wrap;max-width:520px}
.alert input{flex:1;min-width:180px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:700px){.two{grid-template-columns:1fr}nav a{padding:6px 8px}}
.pre{white-space:pre-line}
.note{background:var(--bg2);border-left:4px solid var(--blue);padding:10px 14px;border-radius:6px;color:var(--mut);font-size:14px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:14px}
footer a{color:var(--mut);margin-right:14px}
.share a{margin-right:8px}
label{display:block;font-weight:500;margin:12px 0 4px}
@media (prefers-reduced-motion:no-preference){.hero h1{animation:in .5s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
